[project]
name = "promptshield"
version = "0.1.0"
description = "Real-time security firewall for AI agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4.16.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "ftfy>=6.3.1",
    "httpx>=0.28.1",
    "huggingface-hub>=0.36.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.20",
    "lxml>=6.1.3",
    "mcp>=1.30,<2",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-ulid>=4.1.0",
    "pyyaml>=6.0.3",
    "rapidocr-onnxruntime>=1.4.4",
    "sqlmodel>=0.0.48",
    "structlog>=26.1.0",
    "tokenizers>=0.22.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-psutil>=7.2.2.20260906",
    "types-pyyaml>=6.0.12.20261103",
]
eval = [
    "datasets>=5.0.1",
    "matplotlib>=3.11.2",
]
export = [
    "optimum-onnx>=0.1.0",
    "torch>=2.15.0",
    "transformers>=4.57.6",
]
pii = [
    "en-core-web-sm",
    "presidio-analyzer>=2.2.366",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown is excluded because ruff would rewrite the shorthand Python in the specs.
extend-exclude = ["*.md", "graft", "dashboard", "lab/runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: downloads or loads ML models, or calls Ollama",
    "e2e: full lab run end to end",
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
exclude = ["graft/", "dashboard/", "lab/runs/"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
